<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>csp-safe-slider — destroy() restoration fixture</title>
    <link rel="stylesheet" href="/dist/csp-safe-slider.css" />
    <link rel="stylesheet" href="/dist/theme.css" />
  </head>
  <body>
    <main>
      <h1>destroy() restoration fixture</h1>
      <!-- Deliberately minimal, with no root aria-label/role/dir pre-set,
           so a test can assert the library's own defaults come and go
           cleanly. slide-1's `role="listitem"` is a pre-existing consumer
           attribute the library unconditionally overwrites while active —
           exactly the case that needs `destroy()` to put back, not just
           remove. -->
      <div id="slider" class="csp-slider">
        <div class="csp-slider__track" data-slider-track>
          <div class="csp-slider__slide" data-slider-slide role="listitem" id="slide-1">
            Slide 1
          </div>
          <div class="csp-slider__slide" data-slider-slide id="slide-2">
            Slide 2
            <a href="#x" id="link-2">Link</a>
          </div>
          <div class="csp-slider__slide" data-slider-slide id="slide-3">Slide 3</div>
        </div>
      </div>
    </main>
    <script type="module" src="csp-monitor.js"></script>
    <script type="module" src="destroy-restore.init.js"></script>
  </body>
</html>
